schema_version: 2

bridge:
  # Paths are resolved in code (runtime_paths); values below are documentation hints only.
  paths:
      data_dir: "shared/Data"
      schemas_dir: "schemas"
      episode_state_path: "shared/Data/episode_state.json"

  server:
    host: 0.0.0.0
    port: 8765
    # Keepalive: 5s is too aggressive under normal lag/GC and causes disconnect loops.
    ping_interval_s: 20
    ping_timeout_s: 120
    max_msg_bytes: 1048576
  # Poll runtime_overrides.yaml on disk so edits (or mod GUI writing the file) hot-reload without config_update.
  runtime_overlay_poll_interval_s: 0.5

  streaming:
    target_hz: 12
    max_skips: 2

  queues:
    obs_max: 128
    # Action queue was saturating at 64 while the policy loop blocked on put → obs backlog + multi‑second staleness.
    act_max: 256
    # PolicyWorker latency_stats uses only the last N samples so metrics recover after a spike (not whole deque).
    latency_stats_recent_samples: 48
    obs_drop_policy: oldest
    act_full_behavior: block
    coalesce:
      enabled: false
      kinds: ["look", "move"]

  rate_limits:
    look_hz: 15
    move_hz: 15
    jump_min_ms: 200
    interact_cooldown_ms: 150

  reconnect:
    backoff_ms: [250, 1000, 2000, 5000]
    jitter_ms: 150
    max_attempts: 0
    clear_queues_on_reconnect: true
    new_session_on_reconnect: true

  metrics:
    enabled: true
    sample_interval_s: 2
    emit:
      queue_watermarks: true
      drops_and_timeouts: true
      tick_latency_ms: true
      reconnects: true
    sink:
      kind: file
      path: "logs/bridge_metrics.ndjson"

  logging:
    level: INFO
    json: true
    file:
      enabled: true
      path: "logs/bridge.log.ndjson"

runtime:
  # ---- Control-plane (handshake/actions) ----
  # PLAYER: client WebSocket (integrated SP / packaged bridge + CurseForge). SERVER_BOT: dedicated server bridge.
  control_mode: PLAYER
  hello_timeout_s: 2.0
  discrete_action_timeout_s: 5.0 # wait_for_result=True timeouts (use/select_slot/attack)
  continuous_resend_interval_s: 0.05
  continuous_hold_ticks: 3 # your smoothing hold
  worker_tasks: 1
  validate_actions: true
  default_deadline_ms: 50

  # ---- Policy/Obs encoding ----
  policy:
    type: "online_dqn"
    tick_hz: 20
    budget_ms: 80
    # Drain the act queue faster so PolicyWorker does not block on put when the game/WS is briefly slow.
    max_actions_per_tick: 12
    # Run a gradient / target update every N env transitions (1 = old behavior). Higher cuts CPU a lot.
    train_every_n: 2
    # Write online_dqn_episode_state.json + step_history.jsonl every N steps (always on episode done).
    log_disk_every_n: 5
    max_ray_dist: 20
    success_radius: 1.5
    stuck_speed_thresh: 0.02
    stuck_ticks: 15

    heading:
      max_look_deg: 20.0
      yaw_p_gain: 1.0
      stop_on_collision: true

    action_rates:
      look_hz: 20
      move_hz: 20
      jump_min_ms: 200
      interact_cooldown_ms: 500

    dqn:
      # Resolved against bundle (_MEIPASS) then Data/ (see resource_search_roots). Packaged build includes seed from build_bridge.ps1.
      checkpoint_path: "checkpoints/dqn_initial.pt"
      # Hot-reload (GUI / config_update) overrides; defaults match DQNAgent
      epsilon_start: 1.0
      epsilon_end: 0.1
      epsilon_decay: 100000
      gamma: 0.99
      lr: 0.001
      batch_size: 64
      min_replay_size: 1000
      target_update_freq: 1000
    # Hot-reload (GUI / config_update) overrides; modular components (generic + blocks + mobs)
    reward:
      # Generic (survival, movement, collision, inventory)
      survival_reward: 0.001
      step_penalty: -0.001
      move_scale: 1.0
      max_move_reward: 0.1
      no_progress_penalty: -0.02
      front_clear_bonus: 0.005
      item_pickup_reward: 0.05
      max_steps_per_episode: 2000
      # Custom rewards per block (when obs includes last_block_broken / recent_events)
      blocks: {}
      # e.g. "minecraft:diamond_ore": 1.0, "minecraft:log": 0.1
      # Custom rewards per mob (when obs includes last_mob_killed / recent_events)
      mobs: {}
      # e.g. "minecraft:zombie": 0.5, "minecraft:skeleton": 0.5

  obs:
    rate_hz: 12
    entity_cap: 8
    include:
      pose: true
      world_time_weather_biome: true
      inventory_hotbar_summary: true
      entities_nearby: true
      los_flags: true
    quantization:
      pos_decimals: 2
      angle_decimals: 2
      dist_decimals: 2

  raycasts:
    count: 8
    max_dist: 6.0
    fov_deg: 60
    front_clear_threshold: 1.3
