schema_version: 1

policy:
  tick_hz: 20                # Slightly lower rate = smoother updates, less stutter
  budget_ms: 80
  max_actions_per_tick: 2

  success_radius: 1.5
  stuck_speed_thresh: 0.02
  stuck_ticks: 15

  heading:
    max_look_deg: 20.0        # was 6.0 → allows faster, more decisive turns
    yaw_p_gain: 1.0           # was 0.6 → improves angular response
    stop_on_collision: true

  action_rates:
    look_hz: 20               # sync with tick_hz for steady pacing
    move_hz: 20
    jump_min_ms: 200
    interact_cooldown_ms: 500

obs:
  rate_hz: 12
  entity_cap: 8
  include:
    pose: true
    world_time_weather_biome: true
    inventory_hotbar_summary: true
    entities_nearby: true
    los_flags: true
  quantization:
    pos_decimals: 2
    angle_decimals: 2
    dist_decimals: 2

raycasts:
  count: 8                    # was 5 → wider sampling improves obstacle sense
  max_dist: 6.0
  fov_deg: 60                 # was 30 → better peripheral awareness
  front_clear_threshold: 1.3  # tiny bump to react sooner to walls

worker_tasks: 1
