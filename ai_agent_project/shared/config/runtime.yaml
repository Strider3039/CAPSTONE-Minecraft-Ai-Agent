schema_version: 1

policy:
  tick_hz: 12
  budget_ms: 80
  max_actions_per_tick: 2

  success_radius: 1.5
  stuck_speed_thresh: 0.02
  stuck_ticks: 15

  heading:
    max_look_deg: 6.0
    yaw_p_gain: 0.6
    stop_on_collision: true

  action_rates:
    look_hz: 15
    move_hz: 12
    jump_min_ms: 200
    interact_cooldown_ms: 500

obs:
  rate_hz: 12
  entity_cap: 8
  include:
    pose: true
    world_time_weather_biome: true
    inventory_hotbar_summary: true
    entities_nearby: true
    los_flags: true
  quantization:
    pos_decimals: 2
    angle_decimals: 2
    dist_decimals: 2

raycasts:
  count: 5
  max_dist: 6.0
  fov_deg: 30
  front_clear_threshold: 1.2

worker_tasks: 1
