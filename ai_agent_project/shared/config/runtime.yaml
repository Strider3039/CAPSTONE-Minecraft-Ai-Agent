schema_version: 1

policy:
  type: "online_dqn"        # OnlineDQNPolicy (learns in Minecraft)
  tick_hz: 20
  budget_ms: 80
  max_actions_per_tick: 3
  max_ray_dist: 20          # used by obs encoding / ray distance
  success_radius: 1.5
  stuck_speed_thresh: 0.02
  stuck_ticks: 15

  heading:
    max_look_deg: 20.0
    yaw_p_gain: 1.0
    stop_on_collision: true

  action_rates:
    look_hz: 20
    move_hz: 20
    jump_min_ms: 200
    interact_cooldown_ms: 500

  dqn:
    # Path is interpreted relative to project root by registry.py
    checkpoint_path: "policy/runs/checkpoints/dqn_initial.pt"

obs:
  rate_hz: 12
  entity_cap: 8
  include:
    pose: true
    world_time_weather_biome: true
    inventory_hotbar_summary: true
    entities_nearby: true
    los_flags: true
  quantization:
    pos_decimals: 2
    angle_decimals: 2
    dist_decimals: 2

raycasts:
  count: 8
  max_dist: 6.0
  fov_deg: 60
  front_clear_threshold: 1.3

worker_tasks: 1